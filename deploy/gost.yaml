# Native Windows GOST 3.3.0. Only the handler SENDS PROXY protocol.
# Never enable service/listener metadata.proxyProtocol on an Internet listener.
services:
  - name: edge-http
    addr: 0.0.0.0:80
    handler:
      type: tcp
      metadata:
        proxyProtocol: 1
    listener:
      type: tcp
    forwarder:
      nodes:
        - name: nginx-http
          addr: 127.0.0.1:18080
  - name: edge-https
    addr: 0.0.0.0:443
    handler:
      type: tcp
      metadata:
        proxyProtocol: 1
    listener:
      type: tcp
    forwarder:
      nodes:
        - name: nginx-https
          addr: 127.0.0.1:18443
