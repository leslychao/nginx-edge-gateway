user nginx;
worker_processes auto;
worker_shutdown_timeout 30s;
pid /tmp/nginx.pid;
# Request errors can contain OAuth query strings. HTTP errors are recorded by
# status in the structured access log; stderr is reserved for critical failures.
error_log /dev/stderr crit;

events {
    worker_connections 2048;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_timeout 10m;
    include stream.d/*.conf;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    client_max_body_size 20m;

    log_format gateway escape=json
        '{"time":"$time_iso8601","client":"$remote_addr",'
        '"host":"$host","method":"$request_method","status":$status,'
        '"bytes":$body_bytes_sent,"seconds":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout gateway;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    include runtime/*.conf;
    include conf.d/*.conf;
}
