# TCP clients share coturn's trusted PROXY listener through the application edge.
server {
    listen 3478;
    set $helmglass_turn helmglass-edge:5349;
    proxy_protocol on;
    proxy_pass $helmglass_turn;
}

server {
    listen 5349 ssl;
    ssl_certificate /certificates/live/helmg.ru/fullchain.pem;
    ssl_certificate_key /certificates/live/helmg.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TURN_TLS:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    set $helmglass_turn helmglass-edge:5349;
    proxy_protocol on;
    proxy_pass $helmglass_turn;
}

# Keep the upstream UDP association across allocation, refresh and channel data.
server {
    listen 3478 udp reuseport;
    set $helmglass_turn_udp helmglass-edge:3478;
    proxy_pass $helmglass_turn_udp;
}
