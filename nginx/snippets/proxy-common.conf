proxy_http_version 1.1;
# OAuth response headers can exceed the default page-sized buffer, even with
# proxy_buffering off. Keep the response buffers consistent with this limit.
proxy_buffer_size 16k;
proxy_buffers 4 16k;
proxy_busy_buffers_size 32k;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# This is the first public HTTP proxy; discard client-supplied address chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
proxy_next_upstream off;
