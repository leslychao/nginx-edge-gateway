server {
    listen 80 proxy_protocol;
    server_name helmg.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://helmg.ru$request_uri;
    }
}

server {
    listen 443 ssl proxy_protocol;
    server_name helmg.ru;
    ssl_certificate /certificates/live/helmg.ru/fullchain.pem;
    ssl_certificate_key /certificates/live/helmg.ru/privkey.pem;
    include snippets/ssl-common.conf;
    include snippets/security-headers.conf;

    # Docker DNS permits the application edge to restart independently.
    set $helmglass_backend http://helmglass-edge:8080;
    location / {
        include snippets/proxy-common.conf;
        include snippets/proxy-websocket.conf;
        proxy_buffering off;
        proxy_pass $helmglass_backend;
    }
}
